<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Two org charts. Left, stop doing this: one frontier model node connects directly to a judgment box and six execution boxes, all outlined in amber — no delegation layer. Right, do this instead: the frontier node keeps only the judgment box and hands off to an Undercut dispatch node, which fans out to six execution boxes colored by tier — four teal cheap, one plain standard, one amber escalated on evidence.">
  <title>Stop doing this vs. do this instead — delegating execution down the tier ladder</title>
  <rect x="0" y="0" width="720" height="330" rx="10" fill="#1c2027" stroke="#2f343c" stroke-width="1"/>

  <!-- divider -->
  <line x1="360" y1="20" x2="360" y2="310" stroke="#2f343c" stroke-width="1"/>

  <!-- ══════════════ LEFT · STOP DOING THIS ══════════════ -->
  <text x="30" y="34" font-family="Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#9a9ea4">STOP DOING THIS</text>
  <text x="330" y="34" font-family="Menlo,Consolas,monospace" font-size="11" fill="#6e7278" text-anchor="end">7 / 7 units at frontier</text>

  <rect x="70" y="46" width="220" height="36" rx="4" fill="none" stroke="#c26e12" stroke-width="1.5"/>
  <text x="180" y="69" font-family="Menlo,Consolas,monospace" font-size="12.5" fill="#f2f0ec" text-anchor="middle">FRONTIER MODEL — plans + builds</text>

  <path d="M180 82 V100" stroke="#6e7278" stroke-width="1.25"/>
  <path d="M40 100 H320" stroke="#6e7278" stroke-width="1.25"/>
  <g stroke="#6e7278" stroke-width="1.25">
    <path d="M40 100 V118"/><path d="M87 100 V118"/><path d="M134 100 V118"/><path d="M180 100 V118"/>
    <path d="M226 100 V118"/><path d="M273 100 V118"/><path d="M320 100 V118"/>
  </g>

  <g fill="none" stroke="#c26e12" stroke-width="1.25">
    <rect x="16" y="120" width="48" height="34" rx="3"/><rect x="63" y="120" width="48" height="34" rx="3"/>
    <rect x="110" y="120" width="48" height="34" rx="3"/><rect x="157" y="120" width="48" height="34" rx="3"/>
    <rect x="204" y="120" width="48" height="34" rx="3"/><rect x="251" y="120" width="48" height="34" rx="3"/>
  </g>
  <rect x="298" y="120" width="48" height="34" rx="3" fill="none" stroke="#c26e12" stroke-width="1.5"/>
  <g font-family="Menlo,Consolas,monospace" font-size="9.5" fill="#f2f0ec" text-anchor="middle">
    <text x="40" y="141">SCHEMA</text><text x="87" y="141">API</text><text x="134" y="141">API</text><text x="180" y="141">UI</text>
    <text x="226" y="141">UI</text><text x="273" y="141">TEST</text><text x="322" y="141">PRD</text>
  </g>
  <g font-family="Menlo,Consolas,monospace" font-size="9" fill="#c26e12" text-anchor="middle">
    <text x="40" y="163">1.0×</text><text x="87" y="163">1.0×</text><text x="134" y="163">1.0×</text><text x="180" y="163">1.0×</text>
    <text x="226" y="163">1.0×</text><text x="273" y="163">1.0×</text><text x="322" y="163">1.0×</text>
  </g>

  <line x1="16" y1="182" x2="346" y2="182" stroke="#2f343c" stroke-width="1"/>
  <text x="180" y="200" font-family="Menlo,Consolas,monospace" font-size="10" fill="#6e7278" text-anchor="middle">NO DELEGATION — JUDGMENT + EXECUTION BOTH AT FRONTIER RATES</text>

  <text x="30" y="240" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#9a9ea4">"Asking the VPs for a strategy plan</text>
  <text x="30" y="258" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#9a9ea4">and having them lay every brick</text>
  <text x="30" y="276" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#9a9ea4">themselves." Every token priced like</text>
  <text x="30" y="294" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#9a9ea4">the hardest decision in the project.</text>

  <!-- ══════════════ RIGHT · DO THIS INSTEAD ══════════════ -->
  <text x="390" y="34" font-family="Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#f2f0ec">✓ DO THIS INSTEAD</text>
  <text x="690" y="34" font-family="Menlo,Consolas,monospace" font-size="11" fill="#6e7278" text-anchor="end">1 / 7 units at frontier</text>

  <rect x="450" y="46" width="220" height="36" rx="4" fill="none" stroke="#c26e12" stroke-width="1.5"/>
  <text x="560" y="69" font-family="Menlo,Consolas,monospace" font-size="12.5" fill="#f2f0ec" text-anchor="middle">FRONTIER MODEL — plans, delegates</text>

  <path d="M528 82 V96 H440 V118" fill="none" stroke="#6e7278" stroke-width="1.25"/>
  <path d="M560 82 V96 H620 V118" fill="none" stroke="#6e7278" stroke-width="1.25"/>
  <rect x="376" y="120" width="128" height="34" rx="3" fill="none" stroke="#c26e12" stroke-width="1.5"/>
  <text x="440" y="141" font-family="Menlo,Consolas,monospace" font-size="9.5" fill="#f2f0ec" text-anchor="middle">JUDGMENT · PRD · 1.0×</text>
  <rect x="512" y="120" width="196" height="34" rx="3" fill="none" stroke="#f2f0ec" stroke-width="1.25"/>
  <text x="610" y="141" font-family="Menlo,Consolas,monospace" font-size="9.5" fill="#f2f0ec" text-anchor="middle">UNDERCUT DISPATCH · six-flag gate</text>

  <path d="M610 154 V172" stroke="#6e7278" stroke-width="1.25"/>
  <path d="M400 172 H690" stroke="#6e7278" stroke-width="1.25"/>
  <g stroke="#6e7278" stroke-width="1.25">
    <path d="M400 172 V190"/><path d="M447 172 V190"/><path d="M494 172 V190"/><path d="M541 172 V190"/><path d="M588 172 V190"/>
  </g>
  <path d="M642 172 V190" stroke="#c26e12" stroke-width="1.25"/>

  <g fill="none" stroke-width="1.25">
    <rect x="376" y="192" width="48" height="34" rx="3" stroke="#00959c"/><rect x="423" y="192" width="48" height="34" rx="3" stroke="#00959c"/>
    <rect x="470" y="192" width="48" height="34" rx="3" stroke="#00959c"/><rect x="517" y="192" width="48" height="34" rx="3" stroke="#f2f0ec"/>
    <rect x="564" y="192" width="48" height="34" rx="3" stroke="#00959c"/>
  </g>
  <rect x="618" y="192" width="48" height="34" rx="3" fill="none" stroke="#c26e12" stroke-width="1.5"/>
  <g font-family="Menlo,Consolas,monospace" font-size="9.5" fill="#f2f0ec" text-anchor="middle">
    <text x="400" y="213">SCHEMA</text><text x="447" y="213">API</text><text x="494" y="213">API</text><text x="541" y="213">UI</text>
    <text x="588" y="213">UI</text><text x="642" y="213">TEST</text>
  </g>
  <g font-family="Menlo,Consolas,monospace" font-size="9" text-anchor="middle">
    <text x="400" y="235" fill="#00959c">0.3×</text><text x="447" y="235" fill="#00959c">0.3×</text><text x="494" y="235" fill="#00959c">0.3×</text>
    <text x="541" y="235" fill="#f2f0ec">0.6×</text><text x="588" y="235" fill="#00959c">0.3×</text><text x="642" y="235" fill="#c26e12">↑1.0×</text>
  </g>

  <line x1="376" y1="252" x2="666" y2="252" stroke="#2f343c" stroke-width="1"/>
  <text x="521" y="270" font-family="Menlo,Consolas,monospace" font-size="10" fill="#6e7278" text-anchor="middle">CHEAP BY DEFAULT — ONE UNIT ESCALATED ON EVIDENCE</text>

  <text x="390" y="292" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#9a9ea4">"The VP writes the plan — that costs</text>
  <text x="390" y="310" font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#9a9ea4">VP rates. The team lays the bricks."</text>
</svg>
