name: evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mock-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default single-commit shallow checkout:
          # validate-sitemap.js's lastmod-drift check runs `git log -- <file>`
          # per site page, which on a depth-1 checkout misreports every
          # file's last-commit date as the tip commit's date (a shallow
          # clone has no earlier history to diff against, so every tracked
          # file looks like it was "added" in that one commit). This repo is
          # small, so a full clone costs nothing measurable.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fast, independent static checks first (each reads a handful of files,
      # none depend on another step's output) so a doc/content mistake — the
      # most common PR shape — fails in well under a second instead of after
      # the heavier eval-harness steps below.
      - name: plugin.json version in sync with CHANGELOG.md
        run: node scripts/check-plugin-version.js
      - name: sitemap.xml in sync with site/*.html (incl. lastmod drift)
        run: node scripts/validate-sitemap.js --check
      - name: JSON-LD structured data validity
        run: node scripts/validate-jsonld.js --check
      - name: changelog.xml in sync with CHANGELOG.md
        run: node scripts/generate-changelog-feed.js --check
      - name: Spellcheck site copy (site/*.html)
        run: node scripts/spellcheck.js
      - name: x-dc content in sync with static substitutes (fallback/index.md/pricing.md)
        run: node scripts/validate-dc-drift.js --check
      - name: Client list in sync across FAQ/llms.txt/README.md/AGENTS.md
        run: node scripts/validate-client-list.js --check
      - name: models.md in sync with evals/src/config.js
        run: node scripts/sync-models-md.js --check
      # Heavier eval-harness steps last, cheapest-of-these first: unit tests
      # exercise policy.js/tasks.js in isolation, the mock harness runs the
      # full CLI end-to-end, and the policy-parity run is the slowest/most
      # comprehensive of the three.
      - name: Unit tests (policy.js, tasks.js)
        run: node --test 'src/**/*.test.js'
        working-directory: evals
      - name: Mock harness (all vendors/arms/suites, plumbing check)
        run: node src/main.js --mock --seeds 1
        working-directory: evals
      - name: Policy parity (probe vs v1 vs latest sanity)
        run: node src/main.js --mock --seeds 1 --policy probe
        working-directory: evals
