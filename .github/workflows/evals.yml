name: evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mock-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default single-commit shallow checkout:
          # validate-sitemap.js's lastmod-drift check runs `git log -- <file>`
          # per site page, which on a depth-1 checkout misreports every
          # file's last-commit date as the tip commit's date (a shallow
          # clone has no earlier history to diff against, so every tracked
          # file looks like it was "added" in that one commit). This repo is
          # small, so a full clone costs nothing measurable.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fast, independent static checks first (each reads a handful of files,
      # none depend on another step's output) so a doc/content mistake — the
      # most common PR shape — fails in well under a second instead of after
      # the heavier eval-harness steps below.
      - name: plugin.json version in sync with CHANGELOG.md
        run: node scripts/check-plugin-version.js
      - name: sitemap.xml in sync with site/*.html (incl. lastmod drift)
        run: node scripts/validate-sitemap.js --check
      - name: JSON-LD structured data validity
        run: node scripts/validate-jsonld.js --check
      - name: changelog.xml in sync with CHANGELOG.md
        run: node scripts/generate-changelog-feed.js --check
      # Release backdating: a branch cut before a release and merged after it
      # lands its [Unreleased] entry in what has by then become a DATED
      # section, so work that shipped after the release is documented as part
      # of it (#189 into 0.4.0 — the same incident that left the feed above
      # stale). Both PRs were green against their own base, so a
      # single-revision lint cannot see it: this compares each dated section
      # against its own state at the commit that cut it. Relies on the
      # fetch-depth: 0 history above, and skips the comparison rather than
      # failing when history is unavailable.
      - name: CHANGELOG.md dated sections match the release that cut them
        run: node scripts/validate-changelog-release.js --check
      - name: Spellcheck site copy (site/*.html)
        run: node scripts/spellcheck.js
      - name: x-dc content in sync with static substitutes (fallback/index.md/pricing.md)
        run: node scripts/validate-dc-drift.js --check
      - name: Client list in sync across FAQ/llms.txt/README.md/AGENTS.md
        run: node scripts/validate-client-list.js --check
      # Every companion page now has its own link-preview card. The failure
      # mode is a new page landing with the copy-pasted default meta still
      # in its <head>: a wrong-but-valid OG image looks fine in every check
      # that isn't a human sharing that exact link.
      - name: Per-page og:image/twitter:image point at their own card
        run: node scripts/validate-og-images.js --check
      - name: models.md in sync with evals/src/config.js
        run: node scripts/sync-models-md.js --check
      # Colour contrast is the one design property nobody can eyeball, and
      # the palette lives as literal hex repeated inline across 44 pages, so
      # a value that reads correctly on the light ground silently ships
      # broken on the dark one. This measures both the sanctioned token
      # pairs and the resolved pair at every text node.
      - name: WCAG 2.2 AA colour contrast (token matrix + DOM sweep)
        run: node scripts/validate-contrast.js --check
      # scripts/*.test.js existed but was never executed by CI, so the unit
      # coverage for the guards themselves was dead code. The guards are the
      # thing standing between a content mistake and production; their own
      # detection logic needs testing too.
      - name: Unit tests (scripts/ guards)
        run: node --test 'scripts/**/*.test.js'
      # Heavier eval-harness steps last, cheapest-of-these first: unit tests
      # exercise policy.js/tasks.js in isolation, the mock harness runs the
      # full CLI end-to-end, and the policy-parity run is the slowest/most
      # comprehensive of the three.
      - name: Unit tests (policy.js, tasks.js)
        run: node --test 'src/**/*.test.js'
        working-directory: evals
      - name: Mock harness (all vendors/arms/suites, plumbing check)
        run: node src/main.js --mock --seeds 1
        working-directory: evals
      - name: Policy parity (probe vs v1 vs latest sanity)
        run: node src/main.js --mock --seeds 1 --policy probe
        working-directory: evals
      - name: Lint @undercutsh/cli (syntax check)
        run: npm run lint
        working-directory: cli
      - name: Unit/integration tests (login.js callback server, sync.js cache)
        run: npm test
        working-directory: cli
